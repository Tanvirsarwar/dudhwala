# Local development services only. Never used for staging/production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw_local_only
      POSTGRES_DB: dudhwala_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dw_local
      MINIO_ROOT_PASSWORD: dw_local_only_secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
