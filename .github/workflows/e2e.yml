name: E2E

# Full-stack browser tests: API + storefront + admin against PostgreSQL with the
# demo seed and the payment simulator. Runs on pushes to main, pull requests and
# on demand. Reports and failure traces are uploaded as artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dw
          POSTGRES_PASSWORD: dw_ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dw" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PSQL_ADMIN_URL: postgresql://dw:dw_ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:codegen
      - run: pnpm --filter @dudhwala/e2e exec playwright install --with-deps chromium

      - name: Write CI-only API environment (throwaway secrets)
        run: |
          cat > apps/api/.env <<EOF
          NODE_ENV=development
          WEB_ORIGIN=http://localhost:3000
          ADMIN_ORIGIN=http://localhost:3001
          API_PUBLIC_URL=http://localhost:4000
          API_PORT=4000
          DATABASE_URL=postgresql://dw:dw_ci@localhost:5432/dudhwala_e2e
          SESSION_SECRET=$(openssl rand -base64 32)
          OTP_HMAC_KEY=$(openssl rand -base64 32)
          DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)
          ENABLE_DEV_OUTBOX=true
          EOF

      - name: Start stack (fresh database, demo seed)
        run: bash e2e/stack.sh --fresh-db

      - name: Playwright
        working-directory: e2e
        run: |
          set -a; . ../apps/api/.env; set +a; unset NODE_ENV
          pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/report
            e2e/results
            e2e/.stack/*.log
          if-no-files-found: ignore
