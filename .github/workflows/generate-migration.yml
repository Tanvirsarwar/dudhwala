name: Generate initial migration

# Manually triggered. Generates the initial Prisma migration with the native
# schema engine and commits it, plus a drift report for the dev bootstrap DDL,
# to the branch `ci/initial-migration` for review before merging into main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dw
          POSTGRES_PASSWORD: dw_ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dw" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_URL: postgresql://dw:dw_ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:codegen

      - name: Generate and apply migration
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://dw:dw_ci@localhost:5432/gen_real
        run: |
          psql "$ADMIN_URL" -c 'CREATE DATABASE gen_real'
          mkdir -p prisma/migrations/0001_init
          { echo '-- Generated by .github/workflows/generate-migration.yml (prisma migrate diff) + prisma/sql/constraints.sql'
            echo 'CREATE EXTENSION IF NOT EXISTS citext;'
            echo 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
            pnpm exec prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script
            echo; echo '-- ===== prisma/sql/constraints.sql ====='
            cat prisma/sql/constraints.sql; } > prisma/migrations/0001_init/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/0001_init/migration.sql

      - name: Drift report for scripts/dev-ddl.mjs
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://dw:dw_ci@localhost:5432/gen_dev
        run: |
          psql "$ADMIN_URL" -c 'CREATE DATABASE gen_dev'
          node scripts/dev-ddl.mjs | psql -q -v ON_ERROR_STOP=1 "$DATABASE_URL"
          psql -q -v ON_ERROR_STOP=1 "$DATABASE_URL" -f prisma/sql/constraints.sql
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script > ../../devddl-drift.sql || true

      - name: Commit to ci/initial-migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci/initial-migration
          git add apps/api/prisma/migrations devddl-drift.sql
          git commit -m "chore(db): generated initial migration and dev-ddl drift report"
          git push -f origin ci/initial-migration
