name: Images

# Builds the API (server + migration step), storefront and admin container images.
# - Every push to main: build all images to prove they build (nothing is pushed).
# - Manual run for an environment: build with that GitHub Environment's variables
#   (NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_MEDIA_ORIGINS) and push to
#   GitHub Container Registry as ghcr.io/<owner>/dudhwala-<image>:<environment>-<sha>.
#   The hosting platform deploys those tags (DEPLOYMENT_RUNBOOK §4).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: infra/docker/api.Dockerfile, app: web, target: runtime }
          - { name: api-migrate, dockerfile: infra/docker/api.Dockerfile, app: web, target: migrate }
          - { name: web, dockerfile: infra/docker/next.Dockerfile, app: web, target: runtime }
          - { name: admin, dockerfile: infra/docker/next.Dockerfile, app: admin, target: runtime }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=https://api.example.invalid/v1
            NEXT_PUBLIC_SITE_URL=https://example.invalid
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, dockerfile: infra/docker/api.Dockerfile, app: web, target: runtime }
          - { name: api-migrate, dockerfile: infra/docker/api.Dockerfile, app: web, target: migrate }
          - { name: web, dockerfile: infra/docker/next.Dockerfile, app: web, target: runtime }
          - { name: admin, dockerfile: infra/docker/next.Dockerfile, app: admin, target: runtime }
    steps:
      - uses: actions/checkout@v4
      - name: Require environment variables for the browser bundle
        if: matrix.name == 'web' || matrix.name == 'admin'
        run: |
          test -n "${{ vars.NEXT_PUBLIC_API_URL }}" || { echo "Set NEXT_PUBLIC_API_URL in the ${{ inputs.environment }} environment"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=ghcr.io/${owner}/dudhwala-${{ matrix.name }}:${{ inputs.environment }}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MEDIA_ORIGINS=${{ vars.NEXT_PUBLIC_MEDIA_ORIGINS }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - run: echo "Pushed ${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
